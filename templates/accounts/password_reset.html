{% extends 'base.html' %}
{% block title %}Redefinir senha · Voz em Texto{% endblock %}
{% block content %}<section class="simple-auth card"><p class="eyebrow">Acesso à conta</p><h1>Redefinir senha</h1><p>Informe seu e-mail e enviaremos as instruções para recuperar seu acesso.</p><form class="form-stack" method="post">{% csrf_token %}{{ form.as_p }}<button>Enviar instruções</button></form><p class="auth-footer"><a href="{% url 'login' %}">Voltar para entrar</a></p></section><style>.simple-auth{max-width:500px;margin:30px auto;padding:38px}.simple-auth h1{font-size:34px}.auth-footer{text-align:center;font-size:14px;margin:22px 0 0}</style>{% endblock %}
