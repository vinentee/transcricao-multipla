<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#4f46e5">
  <title>{% block title %}Voz em Texto{% endblock %}</title>
  <style>
    :root{--ink:#172033;--muted:#65708a;--line:#e5e9f2;--paper:#fff;--wash:#f6f7ff;--violet:#5746e8;--violet-dark:#4135c5}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--wash);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}a{color:var(--violet);text-decoration:none;font-weight:650}a:hover{text-decoration:underline}.shell{max-width:1120px;margin:auto;padding:0 24px}.site-header{background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{color:var(--ink);font-weight:850;letter-spacing:-.04em;font-size:20px;display:flex;align-items:center;gap:10px}.brand-mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(140deg,#7668ff,#4236d3);display:inline-grid;place-items:center;color:#fff;font-size:16px}.nav-links{display:flex;align-items:center;gap:22px;font-size:14px}.account{color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.logout-form{margin:0}.button,button{border:0;border-radius:10px;background:var(--violet);color:#fff;cursor:pointer;font:inherit;font-weight:750;padding:11px 16px;transition:.16s ease;box-shadow:0 5px 12px rgba(87,70,232,.18)}.button:hover,button:hover{background:var(--violet-dark);text-decoration:none;transform:translateY(-1px)}.button.secondary{background:#eef0ff;color:#4437c8;box-shadow:none}.button.ghost,button.ghost{background:transparent;color:var(--muted);box-shadow:none;padding:8px}.page{padding:48px 0 64px}.alert{max-width:1120px;margin:20px auto 0;padding:13px 18px;border-radius:12px;background:#fff1ce;color:#765300;border:1px solid #f6d986}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px rgba(39,50,74,.05)}.eyebrow{color:var(--violet);font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin:0 0 10px}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.055em;line-height:1.05;margin:0 0 14px}h2{letter-spacing:-.035em;margin:0}p{color:var(--muted)}label{font-size:14px;font-weight:700;display:block;margin-bottom:7px}input,textarea{font:inherit;color:var(--ink);width:100%;border:1px solid #cad1df;border-radius:10px;padding:11px 12px;background:#fff;outline:0}input:focus,textarea:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(87,70,232,.12)}textarea{min-height:112px;resize:vertical}.form-stack p{margin:0 0 17px}.form-stack button{width:100%;margin-top:4px}.muted{color:var(--muted)}@media(max-width:640px){.shell{padding:0 18px}.nav{height:64px}.nav-links{gap:12px}.account{display:none}.page{padding-top:30px}.brand{font-size:18px}}
  </style>
</head>
<body>
  <header class="site-header"><div class="shell nav"><a class="brand" href="{% url 'dashboard' %}"><span class="brand-mark">≋</span>Voz em Texto</a><nav class="nav-links">{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Meus pedidos</a><span class="account">{{ user.email }}</span><form class="logout-form" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="ghost">Sair</button></form>{% else %}<a href="{% url 'login' %}">Entrar</a><a class="button secondary" href="{% url 'signup' %}">Criar conta</a>{% endif %}</nav></div></header>
  {% for message in messages %}<p class="alert">{{ message }}</p>{% endfor %}
  <main class="shell page">{% block content %}{% endblock %}</main>
</body>
</html>
