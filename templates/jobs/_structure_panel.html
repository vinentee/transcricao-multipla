<section class="structure-panel" data-structure-panel hidden aria-labelledby="structure-heading">
  <h3 id="structure-heading" data-structure-heading>Dividir parágrafo</h3>
  <p data-structure-help>Confira cada parte ouvindo o áudio. Use os horários ou a posição atual do player para marcar os cortes.</p>
  <div data-structure-parts></div>
  <div class="structure-new-speaker"><label>Novo falante<input type="text" maxlength="100" data-structure-speaker-name placeholder="Nome ou identificação"></label><button type="button" class="button secondary" data-structure-add-speaker>Adicionar falante</button></div>
  <label class="quality-confirm compact-check"><input type="checkbox" data-confirm-cuts> Confirmei os horários ouvindo o áudio.</label>
  <div data-overlap-warning hidden><p data-overlap-text></p><label class="quality-confirm compact-check"><input type="checkbox" data-confirm-overlap> Confirmo que este trecho se sobrepõe às falas indicadas.</label></div>
  <p class="structure-error" data-structure-error role="alert"></p>
  <div class="structure-actions"><button type="button" class="button secondary" data-cancel-structure>Cancelar</button><button type="button" data-apply-structure>Aplicar ao rascunho</button></div>
</section>
