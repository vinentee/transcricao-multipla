{% extends 'base.html' %}
{% block title %}{{ job.original_filename }} · Voz em Texto{% endblock %}
{% block content %}
<div data-job-poll data-status-url="{% url 'job_status' job.id %}" data-detail-url="{% url 'job_detail' job.id %}">
{% include 'jobs/_detail.html' %}
<p class="poll-message muted" data-poll-message role="status" aria-live="polite"></p>
</div>
<style>.back{font-size:14px;display:inline-block;margin-bottom:26px}.job-hero{display:flex;justify-content:space-between;gap:30px;align-items:start;margin-bottom:32px}.job-hero h1{font-size:34px;word-break:break-word}.job-hero p{margin:0}.status{font-size:13px;font-weight:800;padding:7px 11px;border-radius:99px;background:#edf0f5;color:#586174;white-space:nowrap}.status-ready{background:#dbf8eb;color:#08754c}.status-processing,.status-paid_queued{background:#e7e5ff;color:#4a3ac7}.status-failed,.status-refunded,.status-refund_pending{background:#ffe8e7;color:#b42318}.quote-card,.failure{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px;margin-bottom:28px}.quote-card h2{font-size:34px}.quote-card p:not(.eyebrow),.failure p{margin:5px 0 0;font-size:14px}.failure{border-color:#f7c8c3;background:#fffafa}.failure form{flex:none}.editor{padding:28px}.editor-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:25px}.editor-head h2{font-size:25px}.downloads{display:flex;gap:8px}.downloads .button{padding:8px 12px;font-size:13px}.speaker-fields{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.speaker-fields label{flex:1;min-width:160px}.speaker-fields input{margin-top:6px}.delete-form{margin-top:24px}.delete-form button{color:#a33b35}.delete-form button:hover{background:#fff0ef}.audio-removed{padding:13px 16px;border-radius:10px;background:#edf8f2;color:#08754c;font-size:14px}@media(max-width:640px){.job-hero,.quote-card,.failure,.editor-head{display:block}.job-hero .status{display:inline-block;margin-top:16px}.quote-card button,.failure button{width:100%;margin-top:20px}.downloads{margin-top:15px}.segment{grid-template-columns:1fr}}</style>
{% endblock %}
